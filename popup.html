<!DOCTYPE html>
<html style="overflow: hidden; height: auto;">

<head>
    <style>
        body {
            width: 300px;
            min-height: 200px;
            text-align: center;
            background-color: #002d5f;
            color: white;
            margin: 0px;
            scrollbar-color: #ccc rgba(0, 0, 0, 0);
            scrollbar-width: thin;
            scroll-behavior: smooth;
            font-family: Arial, Helvetica, sans-serif;
        }

        .mainTitle {
            font-weight: normal;
            margin-top: 0px;
            padding-top: 16px;
            margin-bottom: 4px;
        }

        .subTitle {
            font-weight: normal;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 8px;
            margin-top: 4px;
        }

        .separator {
            width: 80%;
            margin-top: 4px;
            margin-bottom: 12px;
            height: 2px;
            color: #ccc;
            background-color: #ccc;
            border: none;
            border-radius: 4px;
        }

        .lineBreak {
            height: 12px;
        }

        .evenSpacing {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
        }

        #mainControls {
            height: 100%;
        }

        .menuButton {
            width: 37px;
            height: 37px;
            border: none;
            background-color: #ccc;
            border-radius: 4px;
            padding: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .menuButton:hover {
            filter: brightness(0.90);
        }

        .menuButton:active {
            filter: brightness(0.75);
        }

        .menuButton.loading {
            cursor: wait;
            background-color: #ccc;
        }

        .menuButton.loading .buttonImg {
            visibility: hidden;
        }

        .menuButton.loading::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
        }

        .buttonImg {
            width: 75%;
            height: 75%;
        }

        .green {
            background-color: #67D891;
        }

        .red {
            background-color: #ED3E7B;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px 6px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .h5pInput {
            width: 75px;
            border-radius: 1px;
            border: none;
            outline: none;
            background-color: #fff;
        }

        .h5pInput:focus {
            background-color: #eea;
        }

        .settingLabel {
            font-size: 14px;
            margin-left: 20px;
            text-align: left;
        }

        .toggleLabel {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggleLabel input { 
            display: none;
        }

        .toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .15s;
            transition: .15s;
            border-radius: 30px;
        }

        .toggle:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            -webkit-transition: .15s;
            transition: .15s;
            border-radius: 50%;
        }

        input:checked + .toggle {
            background-color: #67D891;
        }

        input:checked + .toggle:before {
            -webkit-transform: translateX(24px);
            -ms-transform: translateX(24px);
            transform: translateX(24px);
        }

        .overflowAuto {
            overflow: auto;
        }

        .footer {
            margin-bottom: 8px;
        }

        .supportLink {
            color: #fff;
        }

        .supportLink:active {
            filter: brightness(0.75);
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background-color: #002d5f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            border: none;
        }

        .loadingSpinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.25);
            border-top: 6px solid white;
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="overflowAuto">

    <div id="loadingOverlay">
        <div class="loadingSpinner"></div>
    </div>
    
    <div id="mainControls">
        <h1 class="mainTitle">A11y Web Tools</h1>
        <hr class="separator" />

        <div class="evenSpacing">
            <button class="menuButton green" title="Activate all a11y web tools" id="activateAllA11yTools"><img class="buttonImg" src="images/all.svg" /></button>
            <button class="menuButton red" title="Deactivate all a11y web tools" id="deactivateAllA11yTools"><img class="buttonImg" src="images/none.svg" /></button>
        </div>

        <div class="lineBreak"></div>

        <div class="evenSpacing">
            <button class="menuButton" title="Toggle image overlays" id="toggleImageOverlays"><img class="buttonImg" src="images/image.svg" /></button>
            <button class="menuButton" title="Toggle iframe overlays" id="toggleIframeOverlays"><img class="buttonImg" src="images/iframe.svg" /></button>
            <button class="menuButton" title="Toggle heading overlays" id="toggleHeadingOverlays"><img class="buttonImg" src="images/heading.svg" /></button>
        </div>

        <div class="lineBreak"></div>

        <div class="evenSpacing">
            <button class="menuButton" title="Toggle table issue overlays" id="toggleTableOverlays"><img class="buttonImg" src="images/table.svg" /></button>
            <button class="menuButton" title="Toggle contrast issue highlighting" id="toggleContrastHighlights"><img class="buttonImg" src="images/color.svg" /></button>
            <button class="menuButton" title="Toggle potential lang tag issue highlighting" id="toggleLangTagHighlights"><img class="buttonImg" src="images/lang.svg" /></button>
        </div>

        <div class="lineBreak"></div>

        <hr class="separator" />

        <h2 class="subTitle">Count Elements</h2>
        <div class="evenSpacing">
            <button class="menuButton" title="Toggle table counting overlays" id="toggleTableCounting"><img class="buttonImg" src="images/table.svg" /></button>
            <button class="menuButton" title="Toggle iframe counting overlays" id="toggleIframeCounting"><img class="buttonImg" src="images/iframe.svg" /></button>
            <button class="menuButton" title="Toggle paragraph counting overlays" id="toggleParagraphCounting"><img class="buttonImg" src="images/paragraph.svg" /></button>
        </div>

        <div class="lineBreak"></div>

        <hr class="separator" />

        <div class="evenSpacing">
            <button class="menuButton" title="Use raw HTML editor by default" id="toggleDefaultEditor"><img class="buttonImg" src="images/coding.svg" /></button>
            <button class="menuButton" title="Open dropdown menus by default" id="toggleDefaultDropdownMenus"><img class="buttonImg" src="images/dropdown.svg" /></button>
        </div>

        <div class="lineBreak"></div>

        <div class="evenSpacing">
            <button class="menuButton" title="Toggle color contrast inspector" id="toggleContrastInspector"><img class="buttonImg" src="images/cursor.svg" /></button>
            <button class="menuButton" title="Download SLA files" id="downloadSLAFiles"><img class="buttonImg" src="images/spreadsheet.svg" /></button>
        </div>

        <div class="lineBreak"></div>
    </div>

    <script src="popup.js"></script>

</body>

</html>
